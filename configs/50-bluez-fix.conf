# WirePlumber 0.5+ Bluetooth configuration for budget TWS earbuds (JieLi / Jerry SoC)
# Path: ~/.config/wireplumber/wireplumber.conf.d/50-bluez-fix.conf

monitor.bluez.properties = {
  # Prioritize AAC over SBC, disable heavy codecs
  bluez5.codecs = [ aac sbc ]
  bluez5.default.rate = 44100
  bluez5.enable-sbc-xq = false
  bluez5.enable-msbc = false
  bluez5.enable-hw-volume = false
  bluez5.roles = [ a2dp_source ]
}

monitor.bluez.rules = [
  {
    matches = [
      {
        device.name = "~bluez_card.*"
      }
    ]
    actions = {
      update-props = {
        bluez5.codecs = [ aac sbc ]
      }
    }
  },
  {
    matches = [
      {
        node.name = "~bluez_output.*"
      }
    ]
    actions = {
      update-props = {
        node.latency = "2048/44100"
      }
    }
  }
]
