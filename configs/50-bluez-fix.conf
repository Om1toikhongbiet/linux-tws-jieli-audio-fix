# WirePlumber 0.5+ Bluetooth configuration for budget TWS earbuds (JieLi / Jerry SoC)
# Path: ~/.config/wireplumber/wireplumber.conf.d/50-bluez-fix.conf

monitor.bluez.properties = {
  # Force 44.1 kHz sample rate to reduce A2DP bandwidth by ~10% compared to 48 kHz
  bluez5.default.rate = 44100

  # Disable non-standard SBC-XQ (too heavy for budget TWS chips)
  bluez5.enable-sbc-xq = false

  # Disable mSBC to prevent wideband SCO conflicts
  bluez5.enable-msbc = false

  # Disable hardware volume if headset firmware fails to handle AVRCP volume
  bluez5.enable-hw-volume = false

  # Restrict to A2DP audio sender to prevent buggy firmware from opening broken HFP/HSP calls
  bluez5.roles = [ a2dp_source ]
}

monitor.bluez.rules = [
  {
    matches = [
      {
        node.name = "~bluez_output.*"
      }
    ]
    actions = {
      update-props = {
        node.latency = "2048/44100"
        audio.rate = 44100
      }
    }
  }
]
