# PipeWire clock and quantum configuration for stable Bluetooth TWS audio
# Path: ~/.config/pipewire/pipewire.conf.d/10-rates.conf

context.properties = {
  # Default clock rate 44.1 kHz (CD quality, matches native YouTube / Spotify music streams)
  default.clock.rate = 44100
  default.clock.allowed-rates = [ 44100, 48000 ]

  # Provide comfortable buffer headroom to avoid underruns on budget BT adapters
  default.clock.min-quantum = 512
  default.clock.quantum = 2048
  default.clock.max-quantum = 4096
}
