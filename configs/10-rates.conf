# PipeWire audio clock and quantum configuration
# Path: ~/.config/pipewire/pipewire.conf.d/10-rates.conf

context.properties = {
  # Standard sample rates (prefer bit-perfect 44.1 kHz for music)
  default.clock.rate = 44100
  default.clock.allowed-rates = [ 44100, 48000 ]

  # Lock minimum quantum to 2048 to prevent browsers (Chromium/YouTube Music)
  # from shrinking buffer size down to 512, which starves Bluetooth packet queues.
  default.clock.min-quantum = 2048
  default.clock.quantum = 2048
  default.clock.max-quantum = 4096
}
